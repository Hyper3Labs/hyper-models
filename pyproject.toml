[project]
name = "hyper-models"
version = "0.3.3"
description = "A model zoo for non-Euclidean embedding models (hyperbolic, spherical, product manifolds)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "hyper3labs" }]
keywords = ["embeddings", "hyperbolic", "onnx", "clip", "model-zoo", "non-euclidean"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    # onnxruntime stopped publishing cp310 wheels after 1.23.x; without this
    # split a universal resolution picks a release that cannot install on the
    # 3.10 this package still supports.
    "onnxruntime>=1.20,<1.24; python_version<'3.11'",
    "onnxruntime>=1.20; python_version>='3.11'",
    "huggingface-hub>=1.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    # tomllib is stdlib from 3.11; the version test reads pyproject.toml on 3.10 too.
    "tomli>=2.0; python_version<'3.11'",
]
ml = [
    "torch>=2.9.1",
    "timm>=1.0.0",
    "transformers>=5.0.0,<6.0",
    "safetensors>=0.4.0",
    "pyyaml>=6.0.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0",
]

[project.urls]
Homepage = "https://github.com/Hyper3Labs/hyper-models"
Repository = "https://github.com/Hyper3Labs/hyper-models"
Documentation = "https://github.com/Hyper3Labs/hyper-models#readme"
Issues = "https://github.com/Hyper3Labs/hyper-models/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hyper_models", "src/hyper3_clip"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
